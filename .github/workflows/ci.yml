name: ClusterMind CI

on:
  push:
    branches:
      - main

jobs:
  build-push-and-update-gitops:
    runs-on: ubuntu-latest

    env:
      DOCKERHUB_USER: chandranavinn
      FRONTEND_IMAGE: chandranavinn/cm2-frontend
      BACKEND_IMAGE: chandranavinn/cm2-backend
      GITOPS_REPO: chandranavinn/clustermind-gitops

    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Clone GitOps repo
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: git clone https://x-access-token:${GITOPS_TOKEN}@github.com/${GITOPS_REPO}.git gitops-checkout

      - name: Write new values.yaml
        run: |
          mkdir -p gitops-checkout/charts/clustermind
          printf '%s\n' \
            "frontend:" \
            "  replicaCount: 2" \
            "  image:" \
            "    repository: ${FRONTEND_IMAGE}" \
            "    tag: ${GITHUB_SHA}" \
            "    pullPolicy: IfNotPresent" \
            "  service:" \
            "    port: 8000" \
            "" \
            "backend:" \
            "  replicaCount: 2" \
            "  image:" \
            "    repository: ${BACKEND_IMAGE}" \
            "    tag: ${GITHUB_SHA}" \
            "    pullPolicy: IfNotPresent" \
            "  service:" \
            "    port: 8000" \
            > gitops-checkout/charts/clustermind/values.yaml
          cat gitops-checkout/charts/clustermind/values.yaml

      - name: Commit and push GitOps change
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          cd gitops-checkout
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/clustermind/values.yaml
          git commit -m "chore: deploy images for ${GITHUB_SHA}" || echo "No changes to commit"
          git push https://x-access-token:${GITOPS_TOKEN}@github.com/${GITOPS_REPO}.git main
